name: Build macOS App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build with PyInstaller
        run: |
          pyinstaller macos_setup.spec

      - name: Compress App Bundle
        run: |
          cd dist
          # The 'y' flag preserves symlinks, which is critical for macOS .app bundles
          zip -ryq LuckyDangle-macOS.zip LuckyDangle.app

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LuckyDangle-macOS
          path: dist/LuckyDangle-macOS.zip