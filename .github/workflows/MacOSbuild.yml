name: Build macOS Application

on:
  workflow_dispatch: # Allows you to run this manually

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller PyQt6

    - name: Build with PyInstaller
      run: |
        # Note: macOS uses a colon (:) instead of a semicolon (;) for --add-data
        pyinstaller --windowed --onefile --add-data "bell_sound.wav:." --add-data "charms:charms" lucky_dangle.py

    - name: Upload Mac Application
      uses: actions/upload-artifact@v4
      with:
        name: LuckyDangle-macOS
        path: dist/
